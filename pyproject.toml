[project]
name = "fssutf-unicode-predicate"
version = "0.1.1"
description = "Checks byte strings for valid UTF-8 encoding, rejecting overlongs, surrogates, and out-of-range code points."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
